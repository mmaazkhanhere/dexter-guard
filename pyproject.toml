[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dexter-guard"
version = "0.1.0"
description = "Evidence-oriented source ingestion foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/source_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
