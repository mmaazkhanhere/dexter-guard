[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dexter-guard"
version = "0.1.0"
description = "Evidence-oriented source ingestion foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/app", "backend/src/source_ingestion", "backend/src/nursing_notes", "backend/src/claim_extraction", "backend/src/evidence_verification", "backend/src/deterministic_validation", "backend/src/source_coverage", "backend/src/human_review", "backend/src/evaluation"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.uv]
package = true
