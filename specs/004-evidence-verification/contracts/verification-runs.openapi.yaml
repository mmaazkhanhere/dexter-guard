openapi: 3.1.0
info:
  title: Dexter Guard Evidence Verification API
  version: 1.0.0
  description: >-
    Versioned transport contract for Spec 004. Canonical domain SourceSpan fields
    source_id, source_version, start, and end are serialized here as sourceId,
    sourceVersion, start, and end. Quotations are separate derived fields.
paths:
  /api/v1/verification-runs:
    post:
      operationId: createVerificationRun
      summary: Create an evidence-verification run for one immutable source and note revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRunRequest'
      responses:
        '200':
          description: A durable successful or failed verification run.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerificationRunSucceeded'
                  - $ref: '#/components/schemas/VerificationRunFailed'
        '400':
          description: Malformed payload that cannot identify a verification attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    VerificationRunRequest:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - sourceVersion
        - noteId
        - noteRevision
        - claimSetId
        - idempotencyKey
        - claims
      properties:
        sourceId:
          type: string
          minLength: 1
        sourceVersion:
          type: integer
          minimum: 1
        noteId:
          type: string
          minLength: 1
        noteRevision:
          type: integer
          minimum: 1
        claimSetId:
          type: string
          minLength: 1
        idempotencyKey:
          type: string
          minLength: 1
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClaimInput'
    ClaimInput:
      type: object
      additionalProperties: false
      required: [claimId, assertion, residentTestId]
      properties:
        claimId:
          type: string
          minLength: 1
        assertion:
          type: string
          minLength: 1
        residentTestId:
          type: string
          minLength: 1
          description: Must equal the source resident or be the explicit value UNKNOWN.
    EvidenceStatus:
      type: string
      enum: [SUPPORTED, UNSUPPORTED, CONTRADICTED, UNCERTAIN]
    Discrepancy:
      type: string
      enum: [NEGATION, CERTAINTY, ATTRIBUTION, CLINICAL_INFERENCE, OTHER]
    SourceSpan:
      type: object
      additionalProperties: false
      required: [sourceId, sourceVersion, start, end]
      properties:
        sourceId:
          type: string
          minLength: 1
        sourceVersion:
          type: integer
          minimum: 1
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
      description: The API mapping of canonical source_id, source_version, start, and end.
    EvidenceQuote:
      type: object
      additionalProperties: false
      required: [span, text]
      properties:
        span:
          $ref: '#/components/schemas/SourceSpan'
        text:
          type: string
          minLength: 1
          description: Derived from the immutable source after span validation; never trusted from a verifier.
    VerifierFinding:
      type: object
      additionalProperties: false
      required: [status, explanation]
      properties:
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        explanation:
          type: string
          minLength: 1
    DeterministicRuleFinding:
      type: object
      additionalProperties: false
      required: [code, outcome]
      properties:
        code:
          type: string
          minLength: 1
        outcome:
          type: string
          enum: [PASS, WARNING, BLOCKING_FAILURE]
    EvidenceFinding:
      type: object
      additionalProperties: false
      required:
        - claimId
        - status
        - explanation
        - sourceSpans
        - evidenceQuotes
        - discrepancies
        - verifierFinding
        - deterministicRuleFindings
      properties:
        claimId:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        explanation:
          type: string
          minLength: 1
        sourceSpans:
          type: array
          items:
            $ref: '#/components/schemas/SourceSpan'
        evidenceQuotes:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceQuote'
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'
        policyVersion:
          type: string
          const: EVIDENCE_ANNOTATION-v1
        verifierFinding:
          $ref: '#/components/schemas/VerifierFinding'
        deterministicRuleFindings:
          type: array
          items:
            $ref: '#/components/schemas/DeterministicRuleFinding'
      allOf:
        - if:
            properties:
              status:
                const: UNSUPPORTED
            required: [status]
          then:
            properties:
              sourceSpans:
                maxItems: 0
              evidenceQuotes:
                maxItems: 0
        - if:
            properties:
              status:
                enum: [SUPPORTED, CONTRADICTED, UNCERTAIN]
            required: [status]
          then:
            properties:
              sourceSpans:
                minItems: 1
              evidenceQuotes:
                minItems: 1
    Failure:
      type: object
      additionalProperties: false
      required: [code, reason]
      properties:
        code:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    VerificationRunBase:
      type: object
      required:
        - verificationRunId
        - sourceId
        - sourceVersion
        - noteId
        - noteRevision
        - claimSetId
        - idempotencyKey
        - evidenceStatusPolicyVersion
        - annotationPolicyVersion
        - status
      properties:
        verificationRunId:
          type: string
          minLength: 1
        sourceId:
          type: string
        sourceVersion:
          type: integer
          minimum: 1
        noteId:
          type: string
        noteRevision:
          type: integer
          minimum: 1
        claimSetId:
          type: string
        idempotencyKey:
          type: string
        evidenceStatusPolicyVersion:
          type: string
          const: EVIDENCE_STATUS-v1
        annotationPolicyVersion:
          type: string
          const: EVIDENCE_ANNOTATION-v1
        status:
          type: string
    VerificationRunSucceeded:
      allOf:
        - $ref: '#/components/schemas/VerificationRunBase'
        - type: object
          required: [findings]
          properties:
            status:
              const: SUCCEEDED
            findings:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/EvidenceFinding'
          not:
            required: [failure]
    VerificationRunFailed:
      allOf:
        - $ref: '#/components/schemas/VerificationRunBase'
        - type: object
          required: [failure]
          properties:
            status:
              enum: [FAILED_VALIDATION, FAILED_EVIDENCE_INTEGRITY, FAILED_VERIFIER, FAILED_PERSISTENCE]
            failure:
              $ref: '#/components/schemas/Failure'
          not:
            required: [findings]
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
