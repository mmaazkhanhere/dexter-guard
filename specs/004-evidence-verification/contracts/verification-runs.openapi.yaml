openapi: 3.1.0
info:
  title: Dexter Guard Evidence Verification API
  version: 1.0.0
  description: >-
    Versioned transport contract for Spec 004. Canonical domain SourceSpan fields
    source_id, source_version, start, and end are serialized here as sourceId,
    sourceVersion, start, and end. Claims are immutable references resolved from
    the claim repository; quotations are separate derived fields.
paths:
  /api/v1/verification-runs:
    post:
      operationId: createVerificationRun
      summary: Synchronously create a terminal evidence-verification run for one immutable source and note revision
      description: >-
        The PoC performs bounded synchronous verification and returns a durable
        terminal run under HTTP 200. It defines no HTTP 202 response or polling endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRunRequest'
      responses:
        '200':
          description: >-
            A durable successful or failed verification run. Repeating an idempotency
            key with the same canonical request digest returns this existing run.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerificationRunSucceeded'
                  - $ref: '#/components/schemas/VerificationRunFailed'
        '400':
          description: Malformed payload that cannot identify a verification attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The idempotency key is already bound to a different canonical request
            digest. No new verification run is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflictError'
components:
  schemas:
    VerificationRunRequest:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - sourceVersion
        - noteId
        - noteRevision
        - claimSetId
        - idempotencyKey
        - claims
      properties:
        sourceId:
          type: string
          minLength: 1
        sourceVersion:
          type: integer
          minimum: 1
        noteId:
          type: string
          minLength: 1
        noteRevision:
          type: integer
          minimum: 1
        claimSetId:
          type: string
          minLength: 1
          description: Exact immutable Spec 003 extractionRunId that owns every referenced claim.
        idempotencyKey:
          type: string
          minLength: 1
          description: >-
            Atomically bound to the canonical input digest. Reuse with identical
            input replays the original run; reuse with different input returns 409.
        claims:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClaimInput'
    ClaimInput:
      type: object
      additionalProperties: false
      required: [claimId, residentTestId]
      properties:
        claimId:
          type: string
          minLength: 1
          description: >-
            Immutable Spec 003 claim reference. The service must resolve it, reject
            unknown/stale/cross-note references, and use the stored assertion rather
            than client-submitted claim text.
        residentTestId:
          type: string
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          not:
            const: UNKNOWN
          description: Must exactly equal the immutable source and resolved claim resident. The PoC does not infer residents.
    EvidenceStatus:
      type: string
      enum: [SUPPORTED, UNSUPPORTED, CONTRADICTED, UNCERTAIN]
    Discrepancy:
      type: string
      enum: [NEGATION, CERTAINTY, ATTRIBUTION, CLINICAL_INFERENCE, OTHER]
    SourceSpan:
      type: object
      additionalProperties: false
      required: [sourceId, sourceVersion, start, end]
      properties:
        sourceId:
          type: string
          minLength: 1
        sourceVersion:
          type: integer
          minimum: 1
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
      description: The API mapping of canonical source_id, source_version, start, and end.
    EvidenceQuote:
      type: object
      additionalProperties: false
      required: [span, text, evidenceRole]
      properties:
        span:
          $ref: '#/components/schemas/SourceSpan'
        text:
          type: string
          minLength: 1
          description: Derived from the immutable source after span validation; never trusted from a verifier.
        evidenceRole:
          type: string
          enum: [SUPPORTING, CONFLICTING, CONTEXT_NON_SUPPORTING]
          description: CONTEXT_NON_SUPPORTING is optional context for an UNSUPPORTED finding and cannot be presented as support.
    VerifierFinding:
      type: object
      additionalProperties: false
      required: [status, explanation]
      properties:
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        explanation:
          type: string
          minLength: 1
    DeterministicRuleFinding:
      type: object
      additionalProperties: false
      required: [code, outcome]
      properties:
        code:
          type: string
          minLength: 1
        outcome:
          type: string
          enum: [PASS, WARNING, BLOCKING_FAILURE]
    EvidenceFinding:
      type: object
      additionalProperties: false
      required:
        - claimId
        - status
        - explanation
        - sourceSpans
        - evidenceQuotes
        - discrepancies
        - policyVersion
        - verifierFinding
        - deterministicRuleFindings
      properties:
        claimId:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        explanation:
          type: string
          minLength: 1
        sourceSpans:
          type: array
          items:
            $ref: '#/components/schemas/SourceSpan'
        evidenceQuotes:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceQuote'
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'
        policyVersion:
          type: string
          const: EVIDENCE_ANNOTATION-v1
          description: The canonical annotation-policy version; certainty has no separate policy version.
        verifierFinding:
          $ref: '#/components/schemas/VerifierFinding'
        deterministicRuleFindings:
          type: array
          items:
            $ref: '#/components/schemas/DeterministicRuleFinding'
      allOf:
        - if:
            properties:
              status:
                const: UNSUPPORTED
            required: [status]
          then:
            properties:
              evidenceQuotes:
                items:
                  properties:
                    evidenceRole:
                      const: CONTEXT_NON_SUPPORTING
                  required: [evidenceRole]
            description: >-
              Unsupported findings may have zero spans and quotations, or one-to-one
              context span/quotation pairs only. Pairing and source-substring checks
              are enforced by the runtime contract validator.
        - if:
            properties:
              status:
                enum: [SUPPORTED, CONTRADICTED, UNCERTAIN]
            required: [status]
          then:
            properties:
              sourceSpans:
                minItems: 1
              evidenceQuotes:
                minItems: 1
    Failure:
      type: object
      additionalProperties: false
      required: [code, reason]
      properties:
        code:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    VerificationRunBase:
      type: object
      required:
        - verificationRunId
        - sourceId
        - sourceVersion
        - noteId
        - noteRevision
        - claimSetId
        - idempotencyKey
        - inputDigest
        - evidenceStatusPolicyVersion
        - annotationPolicyVersion
        - modelId
        - modelVersion
        - promptVersion
        - promptHash
        - correlationId
        - executionTraceId
        - createdAt
        - startedAt
        - completedAt
        - status
      properties:
        verificationRunId:
          type: string
          minLength: 1
        sourceId:
          type: string
        sourceVersion:
          type: integer
          minimum: 1
        noteId:
          type: string
        noteRevision:
          type: integer
          minimum: 1
        claimSetId:
          type: string
        idempotencyKey:
          type: string
        inputDigest:
          type: string
          minLength: 1
          description: Digest of the immutable request identity used for replay and evaluation handoff.
        evidenceStatusPolicyVersion:
          type: string
          const: EVIDENCE_STATUS-v1
        annotationPolicyVersion:
          type: string
          const: EVIDENCE_ANNOTATION-v1
        modelId:
          type: [string, 'null']
          description: Configured verifier model identity, or null when failure occurred before invocation.
        modelVersion:
          type: [string, 'null']
          description: Configured verifier model version, or null when unavailable.
        promptVersion:
          type: [string, 'null']
          description: Version or hash of the verifier prompt, or null when unavailable.
        promptHash:
          type: [string, 'null']
          description: Immutable hash of the exact verifier prompt, or null when unavailable before invocation.
        correlationId:
          type: string
          minLength: 1
        executionTraceId:
          type: string
          minLength: 1
          description: Durable trace identifier linking provider activity, validation, and persistence.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
    VerificationRunSucceeded:
      allOf:
        - $ref: '#/components/schemas/VerificationRunBase'
        - type: object
          required: [findings]
          properties:
            status:
              const: SUCCEEDED
            modelId:
              type: string
              minLength: 1
            modelVersion:
              type: string
              minLength: 1
            promptVersion:
              type: string
              minLength: 1
            promptHash:
              type: string
              minLength: 1
            findings:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/EvidenceFinding'
          not:
            required: [failure]
    VerificationRunFailed:
      allOf:
        - $ref: '#/components/schemas/VerificationRunBase'
        - type: object
          required: [failure]
          properties:
            status:
              enum: [FAILED_VALIDATION, FAILED_EVIDENCE_INTEGRITY, FAILED_VERIFIER, FAILED_PERSISTENCE]
            failure:
              $ref: '#/components/schemas/Failure'
          not:
            required: [findings]
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
    IdempotencyConflictError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          const: IDEMPOTENCY_KEY_CONFLICT
        message:
          type: string
          minLength: 1
